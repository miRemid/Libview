name = "libview"
main = "worker/src/index.ts"
compatibility_date = "2025-10-11"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
PUBLIC_R2_HOST = "view-img.thinkmoe.icu"
R2_BUCKET_NAME = "libview-photos"

[[d1_databases]]
binding = "DB"
database_name = "libview"
database_id = "c3b0e455-7bfc-4f0c-ace7-2806e3480e33"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "libview-photos"

[[routes]]
pattern = "view.thinkmoe.icu"
custom_domain = true

[dev]
port = 8787
