services:
  libview:
    build:
      context: .
      args:
        VITE_PB_URL: ${VITE_PB_URL:-}
    image: libview:latest
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      IMGBED_URL: ${IMGBED_URL:-}
      IMGBED_TOKEN: ${IMGBED_TOKEN:-}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
    restart: unless-stopped

volumes:
  pb_data:
